name: Synapse CI/CD Pipeline

on:
  push:
    branches:
      - development
      - release
      - production
      - main
  pull_request:
    branches:
      - development
      - release
      - production
      - main

jobs:
  server-ci:
    name: Backend CI (Node & Syntax Validation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Validate Server Syntax & Bootstrap
        working-directory: ./server
        env:
          PORT: 5000
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/test_synapse
          JWT_SECRET: test_jwt_secret_key
        run: |
          node -e "const { app } = require('./src/server.js'); console.log('Backend loaded successfully'); process.exit(0);"

  client-ci:
    name: Frontend CI (Vite Build & Asset Verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Client Build
        working-directory: ./client
        run: npm run build

  docker-ci:
    name: Docker Containerization Build (Lab-01)
    needs: [server-ci, client-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: synapse-backend:latest

      - name: Build Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: synapse-frontend:latest
